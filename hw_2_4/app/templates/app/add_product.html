{% extends 'base.html' %}
{% block title %}
    Add New Product
{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>Add New Toy</h1>
    </div>
    <div class="form-card">
        <form action="{% url 'add_product' %}" method="POST" class="toy-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Product Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. LEGO Star Wars"
                    required
                />
            </div>
            <div class="form-group">
                <label for="age_category">Age Category</label>
                <input
                    type="text"
                    id="age_category"
                    name="age_category"
                    placeholder="e.g. 3+"
                    required
                />
            </div>
            <div class="form-group">
                <label for="material">Material</label>
                <input
                    type="text"
                    id="material"
                    name="material"
                    placeholder="e.g. Plastic"
                    required
                />
            </div>
            <div class="form-group">
                <label for="brand">Brand</label>
                <input
                    type="text"
                    id="brand"
                    name="brand"
                    placeholder="e.g. Mattel"
                    required
                />
            </div>
            <div class="form-group">
                <label for="price">Price ($)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    placeholder="0.00"
                    required
                />
            </div>
            <button type="submit" class="btn-submit">Add to Collection</button>
        </form>
    </div>
{% endblock %}
